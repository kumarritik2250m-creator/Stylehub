<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sign In & Register | XPORD Luxury Modern Apparel</title>
    <meta name="description" content="Access your XPORD account to complete checkout, sync your saved cart, and track orders." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..900;1,400..900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/style.css" />

    <style>
      .login-page-body {
        min-height: 100vh;
        background: var(--bg-body, #fafafa);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .login-navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem 2rem;
        background: var(--bg-card, #ffffff);
        border-bottom: 1px solid var(--border-subtle, rgba(0,0,0,0.06));
      }
      .login-brand-title {
        font-family: var(--font-display, 'Syne', sans-serif);
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: 2px;
        color: var(--text-primary, #111111);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .login-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 1.1rem;
        border-radius: var(--radius-xs, 4px);
        border: 1px solid var(--border-medium, #e5e5e5);
        background: transparent;
        color: var(--text-primary, #111111);
        font-weight: 700;
        font-size: 0.85rem;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .login-back-btn:hover {
        background: var(--bg-subtle, #f5f5f5);
        border-color: var(--text-primary, #111111);
      }
      .login-card-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1rem;
      }
      .login-luxury-card {
        width: 100%;
        max-width: 440px;
        background: var(--bg-card, #ffffff);
        border: 1px solid var(--border-subtle, rgba(0,0,0,0.08));
        border-radius: var(--radius-md, 12px);
        box-shadow: 0 12px 36px rgba(0,0,0,0.04);
        padding: 2.2rem 2rem;
      }
      .login-auth-tabs {
        display: flex;
        border-bottom: 2px solid var(--border-subtle, #f0f0f0);
        margin-bottom: 1.5rem;
      }
      .login-auth-tab {
        flex: 1;
        padding: 0.75rem 0.5rem;
        background: none;
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text-muted, #737373);
        cursor: pointer;
        position: relative;
        transition: color 0.2s ease;
      }
      .login-auth-tab.active {
        color: var(--text-primary, #111111);
      }
      .login-auth-tab.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--text-primary, #111111);
      }
      .login-form-group {
        margin-bottom: 1.1rem;
        text-align: left;
      }
      .login-form-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-secondary, #404040);
        margin-bottom: 0.35rem;
      }
      .login-form-input {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--border-medium, #d4d4d4);
        border-radius: var(--radius-xs, 4px);
        font-size: 0.9rem;
        background: var(--bg-subtle, #fafafa);
        color: var(--text-primary, #111111);
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .login-form-input:focus {
        border-color: var(--text-primary, #111111);
        background: #ffffff;
      }
      .login-pwd-wrapper {
        position: relative;
      }
      .login-pwd-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted, #737373);
        cursor: pointer;
        padding: 4px;
      }
      .login-toast-stack {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .login-checkout-banner {
        display: none;
        align-items: center;
        gap: 0.75rem;
        background: rgba(217, 119, 6, 0.08);
        border: 1px solid rgba(217, 119, 6, 0.35);
        border-radius: var(--radius-xs, 4px);
        padding: 0.75rem 0.9rem;
        margin-bottom: 1.3rem;
        text-align: left;
      }
    </style>
  </head>
  <body class="login-page-body">

    <!-- Top Navigation Header -->
    <header class="login-navbar">
      <a href="index.html" class="brand-logo" style="text-decoration: none; gap: 0.6rem;">
        <div class="brand-logo-mark" style="width: 32px; height: 32px;">
          <svg class="brand-logo-svg" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="xpordGoldGradLogin" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#C59B27"/>
                <stop offset="25%" stop-color="#E5C158"/>
                <stop offset="50%" stop-color="#FDF0A6"/>
                <stop offset="75%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#AA771C"/>
              </linearGradient>
            </defs>
            <path d="M48 38 C48 20 72 20 72 38" stroke="url(#xpordGoldGradLogin)" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M22 38 L44 38 L54 54 L36 54 Z" fill="url(#xpordGoldGradLogin)"/>
            <path d="M42 38 L78 38 L72 70 L48 70 Z" fill="url(#xpordGoldGradLogin)"/>
            <path d="M24 84 L42 84 L56 62 L42 62 Z" fill="url(#xpordGoldGradLogin)"/>
            <path d="M68 62 L82 84 L100 84 L80 62 Z" fill="url(#xpordGoldGradLogin)"/>
            <path d="M20 76 Q 50 68 80 44 L76 36 L108 26 L100 58 L92 50 Q 64 74 20 76 Z" fill="url(#xpordGoldGradLogin)"/>
          </svg>
        </div>
        <div class="brand-text-group">
          <span class="brand-title" style="font-size: 1.4rem;">xpord</span>
          <span class="brand-sub" style="font-size: 0.5rem;">CLOTHING</span>
        </div>
      </a>
      <a href="index.html" class="login-back-btn">
        <i class="fa-solid fa-arrow-left"></i> <span>Back to Store</span>
      </a>
    </header>

    <!-- Main Authentication Box -->
    <main class="login-card-container">
      <div class="login-luxury-card">

        <!-- Banner shown when forwarded from checkout/Buy Now -->
        <div id="checkout-intent-banner" class="login-checkout-banner">
          <i class="fa-solid fa-bag-shopping" style="color:var(--accent-gold, #d97706); font-size:1.3rem; flex-shrink:0;"></i>
          <div style="font-size:0.82rem; color:var(--text-primary); line-height:1.4;">
            <strong style="display:block; margin-bottom:1px; font-size:0.88rem;">Proceeding to Express Checkout</strong>
            <span style="color:var(--text-secondary);">Please sign in or create an account. Your shopping bag and selections are safely preserved.</span>
          </div>
        </div>

        <div style="text-align:center; margin-bottom:1.4rem;">
          <h1 style="font-family:var(--font-display, 'Syne', sans-serif); font-size:1.6rem; font-weight:800; letter-spacing:0.5px; margin-bottom:0.3rem;">XPORD ACCOUNT</h1>
          <p style="font-size:0.85rem; color:var(--text-muted);">Sign in to access your orders, saved bag, and express delivery.</p>
        </div>

        <!-- Google One-Click Sign-In -->
        <button type="button" id="google-signin-btn" onclick="handleGoogleSignIn()" class="google-btn" style="width:100%; padding:0.75rem; border:1px solid var(--border-medium, #e5e5e5); background:#ffffff; color:#222222; font-weight:700; border-radius:var(--radius-xs, 4px); display:flex; align-items:center; justify-content:center; gap:0.6rem; cursor:pointer; font-size:0.88rem; margin-bottom:1.3rem; box-shadow:0 1px 4px rgba(0,0,0,0.06); transition:background 0.2s;">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <div style="display:flex; align-items:center; margin-bottom:1.3rem;">
          <hr style="flex:1; border:none; border-top:1px solid var(--border-medium, #e5e5e5);"/>
          <span style="padding:0 0.6rem; font-size:0.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">or with email</span>
          <hr style="flex:1; border:none; border-top:1px solid var(--border-medium, #e5e5e5);"/>
        </div>

        <!-- Auth Tabs: Login / Register -->
        <div class="login-auth-tabs">
          <button type="button" id="tab-btn-login" class="login-auth-tab active" onclick="switchTab('login')">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
          </button>
          <button type="button" id="tab-btn-register" class="login-auth-tab" onclick="switchTab('register')">
            <i class="fa-solid fa-user-plus"></i> Register
          </button>
        </div>

        <!-- Auth Form -->
        <form onsubmit="handleFormSubmit(event)" id="login-auth-form">
          <div class="login-form-group" id="field-name" style="display:none;">
            <label class="login-form-label" for="auth-name">Full Name <span style="color:#ef4444;">*</span></label>
            <input type="text" id="auth-name" class="login-form-input" placeholder="e.g. Ritik Kumar" autocomplete="name" />
          </div>

          <div class="login-form-group">
            <label class="login-form-label" for="auth-email">Email Address <span style="color:#ef4444;">*</span></label>
            <input type="email" id="auth-email" class="login-form-input" placeholder="name@example.com" required autocomplete="email" />
          </div>

          <div class="login-form-group">
            <label class="login-form-label" for="auth-password">Password <span style="color:#ef4444;">*</span></label>
            <div class="login-pwd-wrapper">
              <input type="password" id="auth-password" class="login-form-input" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="login-pwd-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <i id="pwd-toggle-icon" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-form-group" id="field-phone" style="display:none;">
            <label class="login-form-label" for="auth-phone">Mobile Phone (Optional)</label>
            <input type="tel" id="auth-phone" class="login-form-input" placeholder="+91 0000000000" autocomplete="tel" />
          </div>

          <button type="submit" id="auth-submit-btn" class="primary-btn" style="width:100%; padding:0.85rem; font-size:0.92rem; font-weight:700; margin-top:0.6rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Login to Account
          </button>
        </form>

        <div id="auth-toggle-prompt" style="text-align:center; margin-top:1.4rem; font-size:0.85rem; color:var(--text-muted); border-top:1px solid var(--border-medium, #f0f0f0); padding-top:0.9rem;">
          Don't have an account yet? <a href="#" onclick="switchTab('register'); return false;" style="font-weight:700; color:var(--text-primary); text-decoration:underline;">Register / Sign Up</a>
        </div>

      </div>
    </main>

    <!-- Toast Notifications Stack -->
    <div id="login-toast-container" class="login-toast-stack"></div>

    <!-- Script Controller -->
    <script type="module" src="/login.js"></script>
  </body>
</html>
